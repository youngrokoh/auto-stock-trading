name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify generated documentation and links
        run: python3 scripts/docs_guard.py check

      - name: Verify documentation impact
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/docs_guard.py drift --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Verify documentation impact on direct push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/docs_guard.py drift --base-ref "${{ github.event.before }}"

      - name: Run documentation guard scenarios
        run: bash tests/docs-guard-test.sh
