name: auto-stock-trading

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: auto_stock_trading
      POSTGRES_PASSWORD: auto_stock
      POSTGRES_USER: auto_stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_stock -d auto_stock_trading"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      AUTO_STOCK_DATABASE_URL: postgresql+asyncpg://auto_stock:auto_stock@postgres:5432/auto_stock_trading
      AUTO_STOCK_ENVIRONMENT: development
      AUTO_STOCK_VALKEY_URL: redis://valkey:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["taskiq", "worker", "auto_stock_trading.worker.broker:broker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  valkey-data:
