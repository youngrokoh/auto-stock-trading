[project]
name = "auto-stock-trading"
version = "0.1.0"
description = "Safety-first automated stock trading service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx2[http2,brotli,zstd]==2.10.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==26.1.0",
  "taskiq==0.12.4",
  "taskiq-redis==1.2.3",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_stock_trading"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["INP001"]
"src/auto_stock_trading/adapters/database/market_data_rows.py" = ["TC003"]
"src/auto_stock_trading/api/market_data.py" = ["TC003"]
"src/auto_stock_trading/api/models.py" = ["TC001"]
"src/auto_stock_trading/api/*_models.py" = ["TC001", "TC003"]
"src/auto_stock_trading/settings/runtime.py" = ["TC003"]
"tests/**/*.py" = ["PLR2004"]

[tool.basedpyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.14"
typeCheckingMode = "all"
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportPrivateUsage = "error"
